# calibration.yaml
# Eye-in-hand (wrist camera) frames, topics, and calibration name. Marker
# geometry is in marker.yaml.

calibration:
  name: fr3_eye_in_hand               # easy_handeye2 calibration name (output filename)

robot:
  base_frame: fr3_link0
  effector_frame: fr3_link8

camera:
  image_topic: /wrist_camera/color/image_raw
  info_topic: /wrist_camera/color/camera_info
  optical_frame: wrist_camera_color_optical_frame

aruco:
  marker_frame: aruco_marker_frame    # broadcast by aruco_ros/single
