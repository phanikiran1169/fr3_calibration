# calibration_eye_to_hand.yaml
# Eye-to-hand (front camera) frames, topics, and calibration name. Marker
# geometry is in marker.yaml. The marker is rigidly attached to fr3_link7.

calibration:
  name: fr3_eye_to_hand               # easy_handeye2 calibration name (output filename)

robot:
  base_frame: fr3_link0
  effector_frame: fr3_link7           # marker is attached here

camera:
  image_topic: /front_camera/color/image_raw
  info_topic: /front_camera/color/camera_info
  optical_frame: front_camera_color_optical_frame

aruco:
  marker_frame: aruco_marker_frame    # broadcast by aruco_ros/single
