# marker.yaml
# ArUco marker geometry, shared by aruco_ros/single and make_marker.
# Dictionary is compile-time fixed in aruco_ros to ARUCO_MIP_36h12.

aruco:
  marker_id: 26                 # aruco_ros ships pre-rendered JPGs for IDs 26 and 582
  marker_size_m: 0.0478         # measured side length after printing
